<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Space Invaders</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: monospace; }
  body { background: #030712; color: #10b981; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; }
  .header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; font-size: 16px; margin-bottom: 8px; }
  .canvas-wrap { position: relative; width: 100%; max-width: 480px; aspect-ratio: 4/3; }
  canvas { width: 100%; height: 100%; background: #000; border: 2px solid #10b981; border-radius: 8px; display: block; box-shadow: 0 0 20px rgba(16, 185, 129, 0.2); }
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.85); border-radius: 8px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; }
  .overlay.hidden { display: none; }
  .btn { background: #10b981; color: #000; border: none; padding: 10px 24px; font-family: monospace; font-size: 16px; font-weight: bold; cursor: pointer; border-radius: 4px; }
  .btn:hover { background: #34d399; }
</style>
</head>
<body>
  <div class="header">
    <div>SCORE: <span id="score" style="color: #fff;">0</span></div>
    <div>LIVES: <span id="lives" style="color: #ef4444;">❤❤❤</span></div>
  </div>
  <div class="canvas-wrap">
    <canvas id="space" width="480" height="360"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="title" style="font-size: 28px; color: #10b981;">SPACE INVADERS</h1>
      <button class="btn" id="start-btn">DEFEND EARTH</button>
      <p style="color: #6ee7b7; font-size: 12px;">← / → to Move | Space to Fire</p>
    </div>
  </div>

<script>
  const canvas = document.getElementById('space');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const startBtn = document.getElementById('start-btn');

  let isPlaying = false;
  let score = 0;
  let lives = 3;

  const player = {
    x: 220,
    y: 330,
    w: 32,
    h: 16,
    speed: 5,
    dx: 0
  };

  let bullets = [];
  let enemyBullets = [];
  let enemies = [];
  let enemyDir = 1;
  let enemySpeed = 0.8;
  let enemyDrop = false;

  function initEnemies() {
    enemies = [];
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 8; c++) {
        enemies.push({
          x: 40 + c * 48,
          y: 40 + r * 30,
          w: 26,
          h: 18,
          type: r,
          alive: true
        });
      }
    }
  }

  function start() {
    score = 0;
    lives = 3;
    scoreEl.textContent = score;
    livesEl.textContent = '❤❤❤';
    player.x = 220;
    bullets = [];
    enemyBullets = [];
    enemyDir = 1;
    enemySpeed = 0.8;
    initEnemies();
    isPlaying = true;
    overlay.classList.add('hidden');
  }

  function update() {
    if (isPlaying) {
      player.x += player.dx;
      player.x = Math.max(10, Math.min(canvas.width - player.w - 10, player.x));

      // Bullets
      for (let i = 0; i < bullets.length; i++) {
        bullets[i].y -= 7;
        if (bullets[i].y < 0) {
          bullets.splice(i, 1);
          i--;
        }
      }

      // Enemy Bullets
      for (let i = 0; i < enemyBullets.length; i++) {
        enemyBullets[i].y += 3.5;
        // Player hit
        if (
          enemyBullets[i].x > player.x &&
          enemyBullets[i].x < player.x + player.w &&
          enemyBullets[i].y > player.y &&
          enemyBullets[i].y < player.y + player.h
        ) {
          enemyBullets.splice(i, 1);
          i--;
          lives--;
          livesEl.textContent = '❤'.repeat(Math.max(0, lives));
          if (lives <= 0) {
            isPlaying = false;
            titleEl.textContent = 'MISSION FAILED';
            startBtn.textContent = 'RETRY';
            overlay.classList.remove('hidden');
          }
          continue;
        }

        if (enemyBullets[i] && enemyBullets[i].y > canvas.height) {
          enemyBullets.splice(i, 1);
          i--;
        }
      }

      // Move Enemies
      let hitEdge = false;
      let livingEnemies = enemies.filter(e => e.alive);

      if (livingEnemies.length === 0) {
        isPlaying = false;
        titleEl.textContent = 'VICTORY!';
        startBtn.textContent = 'NEXT WAVE';
        overlay.classList.remove('hidden');
      }

      for (let e of livingEnemies) {
        e.x += enemyDir * enemySpeed;
        if (e.x + e.w > canvas.width - 15 || e.x < 15) {
          hitEdge = true;
        }
        if (e.y + e.h >= player.y) {
          isPlaying = false;
          titleEl.textContent = 'INVADED!';
          startBtn.textContent = 'TRY AGAIN';
          overlay.classList.remove('hidden');
        }
      }

      if (hitEdge) {
        enemyDir = -enemyDir;
        for (let e of enemies) {
          e.y += 10;
        }
        enemySpeed = Math.min(2.8, enemySpeed + 0.1);
      }

      // Random Enemy Fire
      if (Math.random() < 0.03 && livingEnemies.length > 0) {
        const shooter = livingEnemies[Math.floor(Math.random() * livingEnemies.length)];
        enemyBullets.push({ x: shooter.x + shooter.w / 2, y: shooter.y + shooter.h });
      }

      // Bullet hit enemy
      for (let bi = 0; bi < bullets.length; bi++) {
        const b = bullets[bi];
        for (let ei = 0; ei < enemies.length; ei++) {
          const e = enemies[ei];
          if (e.alive && b.x > e.x && b.x < e.x + e.w && b.y > e.y && b.y < e.y + e.h) {
            e.alive = false;
            bullets.splice(bi, 1);
            bi--;
            score += (4 - e.type) * 10;
            scoreEl.textContent = score;
            break;
          }
        }
      }
    }

    draw();
    requestAnimationFrame(update);
  }

  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Stars background
    ctx.fillStyle = '#fff';
    for (let i = 0; i < 20; i++) {
      ctx.fillRect((i * 47) % canvas.width, (i * 73 + Date.now() * 0.02) % canvas.height, 1, 1);
    }

    // Player
    ctx.fillStyle = '#10b981';
    ctx.fillRect(player.x + 12, player.y - 4, 8, 4);
    ctx.fillRect(player.x, player.y, player.w, player.h);

    // Bullets
    ctx.fillStyle = '#38bdf8';
    bullets.forEach(b => ctx.fillRect(b.x - 1.5, b.y, 3, 8));

    // Enemy Bullets
    ctx.fillStyle = '#ef4444';
    enemyBullets.forEach(eb => ctx.fillRect(eb.x - 1.5, eb.y, 3, 8));

    // Enemies
    const colors = ['#f43f5e', '#a855f7', '#3b82f6', '#eab308'];
    enemies.forEach(e => {
      if (e.alive) {
        ctx.fillStyle = colors[e.type];
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = '#000';
        ctx.fillRect(e.x + 4, e.y + 4, 4, 4);
        ctx.fillRect(e.x + e.w - 8, e.y + 4, 4, 4);
      }
    });
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') player.dx = -player.speed;
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') player.dx = player.speed;
    else if (e.code === 'Space') {
      e.preventDefault();
      if (isPlaying && bullets.length < 3) {
        bullets.push({ x: player.x + player.w / 2, y: player.y });
      }
    }
  });

  window.addEventListener('keyup', e => {
    if (['ArrowLeft', 'KeyA', 'ArrowRight', 'KeyD'].includes(e.code)) player.dx = 0;
  });

  startBtn.onclick = start;
  update();
</script>
</body>
</html>
