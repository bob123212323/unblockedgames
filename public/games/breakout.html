<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Retro Breakout</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; }
  .header { width: 100%; max-width: 480px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .title { font-size: 24px; font-weight: 900; color: #f43f5e; }
  .stats { display: flex; gap: 15px; font-weight: 700; font-size: 15px; }
  .stats span { color: #f43f5e; }
  .canvas-wrap { position: relative; width: 100%; max-width: 480px; aspect-ratio: 4/3; }
  canvas { width: 100%; height: 100%; background: #020617; border-radius: 12px; border: 2px solid #334155; display: block; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
  .overlay { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.85); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; backdrop-filter: blur(4px); }
  .overlay.hidden { display: none; }
  .btn { background: #f43f5e; color: #fff; border: none; padding: 10px 24px; border-radius: 8px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.15s; }
  .btn:hover { background: #e11d48; }
</style>
</head>
<body>
  <div class="header">
    <div class="title">🧱 Breakout</div>
    <div class="stats">
      <div>Score: <span id="score">0</span></div>
      <div>Lives: <span id="lives">3</span></div>
    </div>
  </div>
  <div class="canvas-wrap">
    <canvas id="game" width="480" height="360"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-msg" style="font-size: 28px; font-weight: 900; color: #fff;">BRICK BREAKER</h2>
      <button class="btn" id="start-btn">PLAY</button>
      <p style="font-size: 13px; color: #94a3b8;">Use Mouse, Touch, or Arrow Keys</p>
    </div>
  </div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlay-msg');
  const startBtn = document.getElementById('start-btn');
  const scoreEl = document.getElementById('score');
  const livesEl = document.getElementById('lives');

  let score = 0;
  let lives = 3;
  let isPlaying = false;

  const paddle = {
    w: 80,
    h: 12,
    x: 200,
    y: 335,
    speed: 7,
    dx: 0
  };

  const ball = {
    x: 240,
    y: 300,
    radius: 6,
    speed: 5,
    dx: 3.5,
    dy: -3.5
  };

  const brickRowCount = 5;
  const brickColumnCount = 8;
  const brickWidth = 50;
  const brickHeight = 16;
  const brickPadding = 6;
  const brickOffsetTop = 40;
  const brickOffsetLeft = 17;

  const brickColors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6'];
  let bricks = [];

  function initBricks() {
    bricks = [];
    for (let c = 0; c < brickColumnCount; c++) {
      bricks[c] = [];
      for (let r = 0; r < brickRowCount; r++) {
        bricks[c][r] = { x: 0, y: 0, status: 1, color: brickColors[r] };
      }
    }
  }

  function start() {
    score = 0;
    lives = 3;
    scoreEl.textContent = score;
    livesEl.textContent = lives;
    paddle.x = (canvas.width - paddle.w) / 2;
    resetBall();
    initBricks();
    isPlaying = true;
    overlay.classList.add('hidden');
  }

  function resetBall() {
    ball.x = paddle.x + paddle.w / 2;
    ball.y = paddle.y - 10;
    ball.dx = 3.5 * (Math.random() < 0.5 ? 1 : -1);
    ball.dy = -3.5;
  }

  function collisionDetection() {
    let allCleared = true;
    for (let c = 0; c < brickColumnCount; c++) {
      for (let r = 0; r < brickRowCount; r++) {
        const b = bricks[c][r];
        if (b.status === 1) {
          allCleared = false;
          if (
            ball.x + ball.radius > b.x &&
            ball.x - ball.radius < b.x + brickWidth &&
            ball.y + ball.radius > b.y &&
            ball.y - ball.radius < b.y + brickHeight
          ) {
            ball.dy = -ball.dy;
            b.status = 0;
            score += (brickRowCount - r) * 10;
            scoreEl.textContent = score;
          }
        }
      }
    }
    if (allCleared) {
      isPlaying = false;
      overlayMsg.textContent = 'YOU WIN! 🎉';
      startBtn.textContent = 'NEXT LEVEL';
      overlay.classList.remove('hidden');
    }
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Draw Bricks
    for (let c = 0; c < brickColumnCount; c++) {
      for (let r = 0; r < brickRowCount; r++) {
        if (bricks[c][r].status === 1) {
          const brickX = c * (brickWidth + brickPadding) + brickOffsetLeft;
          const brickY = r * (brickHeight + brickPadding) + brickOffsetTop;
          bricks[c][r].x = brickX;
          bricks[c][r].y = brickY;
          ctx.fillStyle = bricks[c][r].color;
          ctx.beginPath();
          ctx.roundRect(brickX, brickY, brickWidth, brickHeight, 3);
          ctx.fill();
        }
      }
    }

    // Draw Paddle
    ctx.fillStyle = '#38bdf8';
    ctx.beginPath();
    ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
    ctx.fill();

    // Draw Ball
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();
  }

  function update() {
    if (isPlaying) {
      paddle.x += paddle.dx;
      if (paddle.x < 0) paddle.x = 0;
      if (paddle.x + paddle.w > canvas.width) paddle.x = canvas.width - paddle.w;

      ball.x += ball.dx;
      ball.y += ball.dy;

      // Wall bounce
      if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
        ball.dx = -ball.dx;
      }
      if (ball.y - ball.radius < 0) {
        ball.dy = -ball.dy;
      }

      // Paddle hit
      if (
        ball.y + ball.radius >= paddle.y &&
        ball.y - ball.radius <= paddle.y + paddle.h &&
        ball.x >= paddle.x - ball.radius &&
        ball.x <= paddle.x + paddle.w + ball.radius
      ) {
        const hitPoint = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        ball.dx = hitPoint * 5;
        ball.dy = -Math.abs(ball.dy);
      }

      // Bottom fall
      if (ball.y + ball.radius > canvas.height) {
        lives--;
        livesEl.textContent = lives;
        if (lives <= 0) {
          isPlaying = false;
          overlayMsg.textContent = 'GAME OVER';
          startBtn.textContent = 'TRY AGAIN';
          overlay.classList.remove('hidden');
        } else {
          resetBall();
        }
      }

      collisionDetection();
    }

    draw();
    requestAnimationFrame(update);
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'ArrowLeft' || e.code === 'KeyA') paddle.dx = -paddle.speed;
    else if (e.code === 'ArrowRight' || e.code === 'KeyD') paddle.dx = paddle.speed;
  });

  window.addEventListener('keyup', e => {
    if (['ArrowLeft', 'KeyA', 'ArrowRight', 'KeyD'].includes(e.code)) paddle.dx = 0;
  });

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const relativeX = (e.clientX - rect.left) * (canvas.width / rect.width);
    paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, relativeX - paddle.w / 2));
  });

  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const relativeX = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
    paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, relativeX - paddle.w / 2));
  }, { passive: false });

  startBtn.onclick = start;
  initBricks();
  update();
</script>
</body>
</html>
