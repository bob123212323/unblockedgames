<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>2048 Classic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background: #1a1b26; color: #f7f8f2; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }
  .header { width: 100%; max-width: 380px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .title { font-size: 38px; font-weight: 900; color: #f59e0b; letter-spacing: -1px; }
  .scores { display: flex; gap: 8px; }
  .score-box { background: #24283b; padding: 6px 14px; border-radius: 8px; text-align: center; min-width: 70px; border: 1px solid #414868; }
  .score-box .label { font-size: 11px; text-transform: uppercase; color: #9aa5ce; font-weight: 700; }
  .score-box .value { font-size: 18px; font-weight: 800; color: #fff; }
  .controls { width: 100%; max-width: 380px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
  .btn { background: #3b82f6; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.15s; }
  .btn:hover { background: #2563eb; }
  .grid-container { width: 100%; max-width: 380px; aspect-ratio: 1/1; background: #24283b; border-radius: 12px; padding: 12px; display: grid; grid-template-columns: repeat(4, 1fr); grid-gap: 10px; position: relative; border: 2px solid #414868; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
  .tile { width: 100%; height: 100%; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; transition: transform 0.1s ease-in-out; }
  .tile-empty { background: #1a1b26; }
  .tile-2 { background: #334155; color: #f8fafc; }
  .tile-4 { background: #475569; color: #f8fafc; }
  .tile-8 { background: #f97316; color: #fff; }
  .tile-16 { background: #ea580c; color: #fff; }
  .tile-32 { background: #ef4444; color: #fff; }
  .tile-64 { background: #dc2626; color: #fff; }
  .tile-128 { background: #eab308; color: #fff; font-size: 22px; box-shadow: 0 0 10px rgba(234, 179, 8, 0.4); }
  .tile-256 { background: #ca8a04; color: #fff; font-size: 22px; box-shadow: 0 0 12px rgba(202, 138, 4, 0.5); }
  .tile-512 { background: #10b981; color: #fff; font-size: 22px; }
  .tile-1024 { background: #06b6d4; color: #fff; font-size: 18px; }
  .tile-2048 { background: #8b5cf6; color: #fff; font-size: 18px; box-shadow: 0 0 20px #8b5cf6; animation: glow 1s infinite alternate; }
  @keyframes glow { from { transform: scale(1); } to { transform: scale(1.04); } }
  .overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.85); border-radius: 12px; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 15px; backdrop-filter: blur(4px); }
  .overlay.active { display: flex; }
  .overlay-msg { font-size: 32px; font-weight: 900; color: #fff; }
  .instructions { margin-top: 15px; font-size: 13px; color: #9aa5ce; text-align: center; }
</style>
</head>
<body>
  <div class="header">
    <div class="title">2048</div>
    <div class="scores">
      <div class="score-box"><div class="label">Score</div><div class="value" id="score">0</div></div>
      <div class="score-box"><div class="label">Best</div><div class="value" id="best">0</div></div>
    </div>
  </div>
  <div class="controls">
    <span style="font-size: 13px; color:#9aa5ce">Join tiles to reach <b>2048!</b></span>
    <button class="btn" id="new-game">New Game</button>
  </div>
  <div class="grid-container" id="grid">
    <div class="overlay" id="overlay">
      <div class="overlay-msg" id="overlay-text">Game Over</div>
      <button class="btn" id="restart-btn" style="padding: 10px 24px; font-size: 16px;">Try Again</button>
    </div>
  </div>
  <div class="instructions">Use <b>Arrow Keys</b>, <b>WASD</b>, or swipe on touchscreen to slide tiles.</div>

<script>
  let grid = Array(4).fill(0).map(() => Array(4).fill(0));
  let score = 0;
  let best = parseInt(localStorage.getItem('2048_best') || '0', 10);
  document.getElementById('best').textContent = best;
  const gridEl = document.getElementById('grid');
  const overlay = document.getElementById('overlay');
  const overlayText = document.getElementById('overlay-text');

  function init() {
    grid = Array(4).fill(0).map(() => Array(4).fill(0));
    score = 0;
    document.getElementById('score').textContent = score;
    overlay.classList.remove('active');
    addTile();
    addTile();
    render();
  }

  function addTile() {
    let empty = [];
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (grid[r][c] === 0) empty.push({ r, c });
      }
    }
    if (empty.length > 0) {
      let spot = empty[Math.floor(Math.random() * empty.length)];
      grid[spot.r][spot.c] = Math.random() < 0.9 ? 2 : 4;
    }
  }

  function render() {
    const existing = gridEl.querySelectorAll('.tile');
    existing.forEach(e => e.remove());
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        const val = grid[r][c];
        const tile = document.createElement('div');
        tile.className = 'tile ' + (val ? 'tile-' + val : 'tile-empty');
        tile.textContent = val > 0 ? val : '';
        gridEl.appendChild(tile);
      }
    }
    gridEl.appendChild(overlay);
  }

  function slide(row) {
    let filtered = row.filter(val => val > 0);
    for (let i = 0; i < filtered.length - 1; i++) {
      if (filtered[i] === filtered[i + 1]) {
        filtered[i] *= 2;
        score += filtered[i];
        filtered.splice(i + 1, 1);
      }
    }
    while (filtered.length < 4) filtered.push(0);
    return filtered;
  }

  function move(dir) {
    let prev = JSON.stringify(grid);
    if (dir === 'left') {
      for (let r = 0; r < 4; r++) grid[r] = slide(grid[r]);
    } else if (dir === 'right') {
      for (let r = 0; r < 4; r++) grid[r] = slide(grid[r].reverse()).reverse();
    } else if (dir === 'up') {
      for (let c = 0; c < 4; c++) {
        let col = [grid[0][c], grid[1][c], grid[2][c], grid[3][c]];
        col = slide(col);
        for (let r = 0; r < 4; r++) grid[r][c] = col[r];
      }
    } else if (dir === 'down') {
      for (let c = 0; c < 4; c++) {
        let col = [grid[3][c], grid[2][c], grid[1][c], grid[0][c]];
        col = slide(col);
        for (let r = 0; r < 4; r++) grid[3 - r][c] = col[r];
      }
    }

    if (JSON.stringify(grid) !== prev) {
      addTile();
      document.getElementById('score').textContent = score;
      if (score > best) {
        best = score;
        localStorage.setItem('2048_best', best);
        document.getElementById('best').textContent = best;
      }
      render();
      checkState();
    }
  }

  function checkState() {
    let won = false;
    let canMove = false;
    for (let r = 0; r < 4; r++) {
      for (let c = 0; c < 4; c++) {
        if (grid[r][c] === 2048) won = true;
        if (grid[r][c] === 0) canMove = true;
        if (r < 3 && grid[r][c] === grid[r + 1][c]) canMove = true;
        if (c < 3 && grid[r][c] === grid[r][c + 1]) canMove = true;
      }
    }
    if (!canMove) {
      overlayText.textContent = 'Game Over!';
      overlay.classList.add('active');
    } else if (won && !overlay.getAttribute('data-won')) {
      overlayText.textContent = 'You Reached 2048!';
      overlay.setAttribute('data-won', 'true');
      overlay.classList.add('active');
    }
  }

  window.addEventListener('keydown', e => {
    if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); move('up'); }
    else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); move('down'); }
    else if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); move('left'); }
    else if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); move('right'); }
  });

  let touchStartX = 0, touchStartY = 0;
  window.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: false });

  window.addEventListener('touchend', e => {
    let dx = e.changedTouches[0].clientX - touchStartX;
    let dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
      move(dx > 0 ? 'right' : 'left');
    } else if (Math.abs(dy) > 30) {
      move(dy > 0 ? 'down' : 'up');
    }
  }, { passive: false });

  document.getElementById('new-game').addEventListener('click', init);
  document.getElementById('restart-btn').addEventListener('click', init);
  init();
</script>
</body>
</html>
