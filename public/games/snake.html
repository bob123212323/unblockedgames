<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Snake Classic</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; }
  .header { width: 100%; max-width: 420px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .title { font-size: 26px; font-weight: 800; color: #10b981; }
  .stats { display: flex; gap: 10px; }
  .stat { background: #1e293b; padding: 4px 12px; border-radius: 6px; border: 1px solid #334155; font-size: 14px; font-weight: 700; }
  .stat span { color: #10b981; }
  .canvas-wrap { position: relative; width: 100%; max-width: 420px; aspect-ratio: 1/1; }
  canvas { width: 100%; height: 100%; background: #020617; border-radius: 12px; border: 2px solid #334155; display: block; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
  .overlay { position: absolute; inset: 0; background: rgba(2, 6, 23, 0.88); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; backdrop-filter: blur(4px); }
  .overlay.hidden { display: none; }
  .btn { background: #10b981; color: #020617; border: none; padding: 10px 24px; border-radius: 8px; font-size: 16px; font-weight: 800; cursor: pointer; transition: 0.15s; }
  .btn:hover { background: #34d399; }
  .d-pad { display: grid; grid-template-columns: repeat(3, 50px); grid-gap: 8px; margin-top: 15px; }
  .d-btn { height: 50px; background: #1e293b; border: 1px solid #334155; color: #fff; font-size: 20px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .d-btn:active { background: #334155; }
  .empty { visibility: hidden; }
  @media(min-width: 600px) { .d-pad { display: none; } }
</style>
</head>
<body>
  <div class="header">
    <div class="title">🐍 Snake</div>
    <div class="stats">
      <div class="stat">Score: <span id="score">0</span></div>
      <div class="stat">High: <span id="high">0</span></div>
    </div>
  </div>
  <div class="canvas-wrap">
    <canvas id="game" width="400" height="400"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="overlay-msg" style="font-size: 28px; font-weight: 800;">Press Play</h2>
      <button class="btn" id="start-btn">Start Game</button>
      <p style="font-size: 13px; color: #94a3b8;">Use Arrow Keys or WASD</p>
    </div>
  </div>
  <div class="d-pad">
    <div class="empty"></div>
    <button class="d-btn" id="btn-up">⬆️</button>
    <div class="empty"></div>
    <button class="d-btn" id="btn-left">⬅️</button>
    <button class="d-btn" id="btn-down">⬇️</button>
    <button class="d-btn" id="btn-right">➡️</button>
  </div>

<script>
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const overlayMsg = document.getElementById('overlay-msg');
  const scoreEl = document.getElementById('score');
  const highEl = document.getElementById('high');

  const GRID_SIZE = 20;
  const TILE_COUNT = 20;
  let snake = [{x: 10, y: 10}];
  let velocity = {x: 0, y: 0};
  let food = {x: 15, y: 15};
  let score = 0;
  let high = parseInt(localStorage.getItem('snake_high') || '0', 10);
  highEl.textContent = high;
  let gameInterval = null;
  let isRunning = false;
  let nextVel = {x: 0, y: 0};

  function placeFood() {
    let empty = false;
    while (!empty) {
      food.x = Math.floor(Math.random() * TILE_COUNT);
      food.y = Math.floor(Math.random() * TILE_COUNT);
      empty = !snake.some(s => s.x === food.x && s.y === food.y);
    }
  }

  function start() {
    snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
    velocity = {x: 0, y: -1};
    nextVel = {x: 0, y: -1};
    score = 0;
    scoreEl.textContent = score;
    placeFood();
    overlay.classList.add('hidden');
    isRunning = true;
    if (gameInterval) clearInterval(gameInterval);
    gameInterval = setInterval(gameLoop, 100);
  }

  function gameOver() {
    isRunning = false;
    clearInterval(gameInterval);
    overlayMsg.textContent = 'Game Over! Score: ' + score;
    overlay.classList.remove('hidden');
    document.getElementById('start-btn').textContent = 'Play Again';
  }

  function gameLoop() {
    velocity = nextVel;
    const head = {x: snake[0].x + velocity.x, y: snake[0].y + velocity.y};

    // Wall collision
    if (head.x < 0 || head.x >= TILE_COUNT || head.y < 0 || head.y >= TILE_COUNT) {
      return gameOver();
    }

    // Body collision
    if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
      return gameOver();
    }

    snake.unshift(head);

    // Food collision
    if (head.x === food.x && head.y === food.y) {
      score += 10;
      scoreEl.textContent = score;
      if (score > high) {
        high = score;
        localStorage.setItem('snake_high', high);
        highEl.textContent = high;
      }
      placeFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    // Background
    ctx.fillStyle = '#020617';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Grid lines subtle
    ctx.strokeStyle = 'rgba(51, 65, 85, 0.2)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 400; i += GRID_SIZE) {
      ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 400); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(400, i); ctx.stroke();
    }

    // Food (Apple)
    ctx.fillStyle = '#ef4444';
    ctx.beginPath();
    ctx.arc(food.x * GRID_SIZE + 10, food.y * GRID_SIZE + 10, 8, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#10b981';
    ctx.fillRect(food.x * GRID_SIZE + 9, food.y * GRID_SIZE + 2, 2, 4);

    // Snake
    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#10b981' : '#059669';
      ctx.beginPath();
      ctx.roundRect(seg.x * GRID_SIZE + 1, seg.y * GRID_SIZE + 1, GRID_SIZE - 2, GRID_SIZE - 2, 4);
      ctx.fill();

      // Eyes on head
      if (i === 0) {
        ctx.fillStyle = '#020617';
        let ex1 = seg.x * GRID_SIZE + 5, ey1 = seg.y * GRID_SIZE + 5;
        let ex2 = seg.x * GRID_SIZE + 15, ey2 = seg.y * GRID_SIZE + 5;
        ctx.beginPath(); ctx.arc(ex1, ey1, 2, 0, Math.PI*2); ctx.fill();
        ctx.beginPath(); ctx.arc(ex2, ey2, 2, 0, Math.PI*2); ctx.fill();
      }
    });
  }

  function setDir(x, y) {
    if (!isRunning) return;
    if (velocity.x !== -x && velocity.y !== -y) {
      nextVel = {x, y};
    }
  }

  window.addEventListener('keydown', e => {
    if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); setDir(0, -1); }
    else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); setDir(0, 1); }
    else if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); setDir(-1, 0); }
    else if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); setDir(1, 0); }
  });

  document.getElementById('btn-up').onclick = () => setDir(0, -1);
  document.getElementById('btn-down').onclick = () => setDir(0, 1);
  document.getElementById('btn-left').onclick = () => setDir(-1, 0);
  document.getElementById('btn-right').onclick = () => setDir(1, 0);
  document.getElementById('start-btn').onclick = start;
  draw();
</script>
</body>
</html>
