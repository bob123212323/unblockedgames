<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Flappy Bird</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 10px; }
  .canvas-wrap { position: relative; width: 100%; max-width: 360px; aspect-ratio: 9/14; }
  canvas { width: 100%; height: 100%; background: #70c5ce; border-radius: 12px; border: 2px solid #334155; display: block; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
  .overlay { position: absolute; inset: 0; background: rgba(15, 23, 42, 0.75); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; backdrop-filter: blur(4px); }
  .overlay.hidden { display: none; }
  .btn { background: #f59e0b; color: #1e293b; border: none; padding: 12px 28px; border-radius: 10px; font-size: 18px; font-weight: 900; cursor: pointer; transition: 0.15s; }
  .btn:hover { background: #fbbf24; transform: scale(1.03); }
</style>
</head>
<body>
  <div class="canvas-wrap">
    <canvas id="canvas" width="360" height="560"></canvas>
    <div class="overlay" id="overlay">
      <h1 id="title" style="font-size: 32px; font-weight: 900; color: #fef08a;">Flappy Bird</h1>
      <p id="msg" style="color: #cbd5e1; font-size: 15px;">Click, Tap, or Press <b>Space</b> to flap</p>
      <button class="btn" id="start-btn">TAP TO PLAY</button>
      <div id="stats" style="color: #94a3b8; font-size: 14px; margin-top: 5px;">Best: <span id="best-score">0</span></div>
    </div>
  </div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const overlay = document.getElementById('overlay');
  const titleEl = document.getElementById('title');
  const msgEl = document.getElementById('msg');
  const startBtn = document.getElementById('start-btn');
  const bestScoreEl = document.getElementById('best-score');

  let state = 'START'; // START, PLAYING, GAMEOVER
  let frames = 0;
  let score = 0;
  let best = parseInt(localStorage.getItem('flappy_best') || '0', 10);
  bestScoreEl.textContent = best;

  const bird = {
    x: 70,
    y: 250,
    w: 32,
    h: 24,
    gravity: 0.28,
    jump: -5.8,
    velocity: 0,
    rotation: 0,
    reset() {
      this.y = 250;
      this.velocity = 0;
      this.rotation = 0;
    },
    flap() {
      this.velocity = this.jump;
    },
    update() {
      this.velocity += this.gravity;
      this.y += this.velocity;
      this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 6, (this.velocity * 4) * (Math.PI / 180)));
      if (this.y + this.h >= canvas.height - 50) {
        this.y = canvas.height - 50 - this.h;
        endGame();
      }
      if (this.y < 0) {
        this.y = 0;
        this.velocity = 0;
      }
    },
    draw() {
      ctx.save();
      ctx.translate(this.x + this.w / 2, this.y + this.h / 2);
      ctx.rotate(this.rotation);
      
      // Bird body
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.ellipse(0, 0, this.w / 2, this.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#ca8a04';
      ctx.lineWidth = 2;
      ctx.stroke();

      // Wing
      ctx.fillStyle = '#fef08a';
      ctx.beginPath();
      ctx.ellipse(-6, 2, 8, 5, -0.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Eye
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(6, -4, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.arc(8, -4, 2.5, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(20, 3);
      ctx.lineTo(10, 6);
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      ctx.restore();
    }
  };

  const pipes = {
    position: [],
    w: 52,
    gap: 130,
    dx: 2.2,
    reset() {
      this.position = [];
    },
    update() {
      if (frames % 100 === 0) {
        const topH = Math.floor(Math.random() * (canvas.height - 220 - this.gap)) + 50;
        this.position.push({
          x: canvas.width,
          top: topH,
          bottom: topH + this.gap,
          passed: false
        });
      }

      for (let i = 0; i < this.position.length; i++) {
        let p = this.position[i];
        p.x -= this.dx;

        // Collision Check
        if (
          bird.x + bird.w - 6 > p.x &&
          bird.x + 6 < p.x + this.w &&
          (bird.y + 4 < p.top || bird.y + bird.h - 4 > p.bottom)
        ) {
          endGame();
        }

        // Score Check
        if (p.x + this.w < bird.x && !p.passed) {
          score++;
          p.passed = true;
          if (score > best) {
            best = score;
            localStorage.setItem('flappy_best', best);
            bestScoreEl.textContent = best;
          }
        }

        // Remove offscreen
        if (p.x + this.w < 0) {
          this.position.splice(i, 1);
          i--;
        }
      }
    },
    draw() {
      for (let p of this.position) {
        // Top Pipe
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(p.x, 0, this.w, p.top);
        ctx.strokeStyle = '#15803d';
        ctx.lineWidth = 3;
        ctx.strokeRect(p.x, 0, this.w, p.top);
        // Top Cap
        ctx.fillRect(p.x - 3, p.top - 20, this.w + 6, 20);
        ctx.strokeRect(p.x - 3, p.top - 20, this.w + 6, 20);

        // Bottom Pipe
        ctx.fillRect(p.x, p.bottom, this.w, canvas.height - p.bottom - 50);
        ctx.strokeRect(p.x, p.bottom, this.w, canvas.height - p.bottom - 50);
        // Bottom Cap
        ctx.fillRect(p.x - 3, p.bottom, this.w + 6, 20);
        ctx.strokeRect(p.x - 3, p.bottom, this.w + 6, 20);
      }
    }
  };

  const ground = {
    x: 0,
    h: 50,
    update() {
      this.x = (this.x - 2) % 20;
    },
    draw() {
      ctx.fillStyle = '#ded895';
      ctx.fillRect(0, canvas.height - this.h, canvas.width, this.h);
      ctx.fillStyle = '#73bf2e';
      ctx.fillRect(0, canvas.height - this.h, canvas.width, 12);
      ctx.strokeStyle = '#4e731b';
      ctx.lineWidth = 2;
      ctx.strokeRect(0, canvas.height - this.h, canvas.width, 12);
    }
  };

  function loop() {
    frames++;
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Sky Background
    ctx.fillStyle = '#70c5ce';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Clouds
    ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
    ctx.beginPath();
    ctx.arc(80, 100, 30, 0, Math.PI*2);
    ctx.arc(110, 90, 40, 0, Math.PI*2);
    ctx.arc(140, 100, 30, 0, Math.PI*2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(260, 160, 25, 0, Math.PI*2);
    ctx.arc(290, 150, 35, 0, Math.PI*2);
    ctx.arc(320, 160, 25, 0, Math.PI*2);
    ctx.fill();

    if (state === 'PLAYING') {
      pipes.update();
      bird.update();
      ground.update();
    }

    pipes.draw();
    ground.draw();
    bird.draw();

    // Score on screen
    if (state === 'PLAYING') {
      ctx.fillStyle = '#fff';
      ctx.strokeStyle = '#000';
      ctx.lineWidth = 4;
      ctx.font = 'bold 36px sans-serif';
      ctx.textAlign = 'center';
      ctx.strokeText(score, canvas.width / 2, 70);
      ctx.fillText(score, canvas.width / 2, 70);
    }

    requestAnimationFrame(loop);
  }

  function startGame() {
    bird.reset();
    pipes.reset();
    score = 0;
    frames = 0;
    state = 'PLAYING';
    overlay.classList.add('hidden');
    bird.flap();
  }

  function endGame() {
    state = 'GAMEOVER';
    titleEl.textContent = 'Game Over!';
    msgEl.innerHTML = `Score: <b>${score}</b> | Best: <b>${best}</b>`;
    startBtn.textContent = 'PLAY AGAIN';
    overlay.classList.remove('hidden');
  }

  function triggerAction(e) {
    if (e) e.preventDefault();
    if (state === 'PLAYING') {
      bird.flap();
    } else if (state === 'START' || state === 'GAMEOVER') {
      startGame();
    }
  }

  window.addEventListener('keydown', e => {
    if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
      triggerAction(e);
    }
  });

  canvas.addEventListener('mousedown', triggerAction);
  canvas.addEventListener('touchstart', triggerAction, { passive: false });
  startBtn.addEventListener('click', (e) => { e.stopPropagation(); triggerAction(); });

  loop();
</script>
</body>
</html>
